 G.vu.forEach(drawUnit);G.vu.forEach(u=>{if(u.closed){hazard(u.x-(u.k=='stair'?30:20),392,u.k=='stair'?60:40,46);const j=G.jobs.find(x=>x.k=='esc');if(j)tag(u.x,448,'施工 '+Math.round(j.t/j.dur*100)+'%');}});
 const T=G.train;if(T.state!='away'){block(T.x,536,560,46,'#ff8a80','#d05a52',6,10);cx.fillStyle='#fff';for(let i=0;i<10;i++)cx.fillRect(T.x+20+i*54,544,26,16);}
 G.litter.forEach(l=>{cx.fillStyle='#8d9199';cx.beginPath();cx.arc(l.x,l.y,l.s,0,6.3);cx.fill();cx.fillStyle='rgba(255,255,255,.4)';cx.beginPath();cx.arc(l.x-.8,l.y-.8,l.s*.35,0,6.3);cx.fill();});
 const t=performance.now()/1000;const amp=G.guide==0?4.5:G.guide==1?1.8:0;

  if(a.conf){const an=a.angry;cx.fillStyle='#fff';cx.strokeStyle=an?'#d9322e':'#f39c12';cx.lineWidth=2;cx.beginPath();cx.arc(a.x+ox,a.y+oy-17,7,0,6.3);cx.fill();cx.stroke();cx.fillStyle=an?'#c0281c':'#d9830b';cx.font='bold 11px system-ui';cx.textAlign='center';cx.fillText(an?'!':'?',a.x+ox,a.y+oy-13);cx.textAlign='left';}});
 G.cleaners.concat(G.temp).forEach(cleaner);}
/* ---------- loop and controls ---------- */
function syncCtl(){$('pz').textContent=paused?'继续':'暂停';$('sp').textContent='倍速 ×'+speed;$('sp').classList.toggle('on',speed>1);}
$('pz').onclick=()=>{paused=!paused;syncCtl();};
$('sp').onclick=()=>{speed=speed==1?2:speed==2?4:1;syncCtl();};
let uacc=0;
function hud(){$('hday').textContent=G.day;$('hcoin').textContent=Math.round(G.coins);$('hrate').textContent=G.rating.toFixed(2);$('hest').textContent=estIncome();const c=G.clean;$('hclean').style.width=c+'%';$('hclean').style.background=c<45?'#c0392b':'#2e7d5b';$('htime').style.width=Math.min(100,G.t/DAYLEN*100)+'%';}
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(G){if(!paused&&G.phase=='run'){for(let i=0;i<speed;i++)step(dt);}else if(!paused&&G.phase=='prep'&&G.jobs.length)stepJobs(dt);
  else if(G.phase=='prep'){G.cleaners.forEach(c=>stepCleaner(c,dt));G.clean=Math.max(0,100-7*G.litter.length);}
  draw();hud();uacc+=dt;if(uacc>0.25){uacc=0;updBar();if(G.phase=='run')banner();}}raf=requestAnimationFrame(loop);}
window.__test={start:startGame,openDay,buy,endDay,step:dt=>step(dt),get G(){return G},setSel:n=>{sel=st.find(x=>x.name==n)},hide:hideModal,startDay,next:()=>{hideModal();G.day++;startDay();}};
